services:
    nginx:
        image: nginx:alpine
        container_name: green_market_proxy
        restart: unless-stopped
        ports:
            - '80:80' # Port HTTP standard
            - '443:443' # Port HTTPS (Optionnel pour l'instant, indispensable pour le SSL)
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - frontend
            - backend

    frontend:
        image: vials512t/greenmarket:frontend-latest
        container_name: green_market_frontend
        restart: unless-stopped
        env_file:
            - .env.frontend.prod
        depends_on:
            - backend

    backend:
        image: vials512t/greenmarket:backend-latest
        container_name: green_market_backend
        restart: unless-stopped
        ports:
            - '80'
        env_file:
            - .env.backend.prod
        depends_on:
            - db

    db:
        image: mysql:8.0
        container_name: green_market_db
        restart: unless-stopped
        env_file:
            - .env.db.prod
        volumes:
            - db_data:/var/lib/mysql

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: green_market_phpmyadmin
        restart: unless-stopped
        env_file:
            - .env.db.prod
        ports:
            - '127.0.0.1:8080:80'
        depends_on:
            - db

volumes:
    db_data: