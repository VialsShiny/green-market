server {
    listen 80;
    server_name _; # Écoute toutes les requêtes arrivant sur l'IP du VPS

    # GESTION DU BACKEND (API)
    location /api {
        proxy_pass http://green_market_backend:80; # Nom du conteneur Docker backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GESTION DU FRONTEND
    location / {
        root /var/www/frontend;  # ou le chemin où sont tes fichiers dist
        try_files $uri $uri/ /index.html;
    }
}