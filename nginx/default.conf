server {
    listen 80;
    server_name _; # Écoute toutes les requêtes arrivant sur l'IP du VPS

    # GESTION DU BACKEND (API)
    location /api {
        proxy_pass http://green_market_backend:80; # Nom du conteneur Docker backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GESTION DU FRONTEND
    location / {
        proxy_pass http://green_market_frontend:5173; # Nom du conteneur Docker frontend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support des WebSockets (si Vite est configuré en mode dev/hot-reload, optionnel en prod)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}