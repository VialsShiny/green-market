name: Continuous Deployment

on:
    push:
        branches: [main]

jobs:
    deploy-backend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Install dependencies
              run: make install-backend

            - name: Build and push backend image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  file: ./backend/Dockerfile.prod
                  push: true
                  tags: |
                      vials512t/greenmarket:backend-latest
                      vials512t/greenmarket:backend-${{ github.sha }}

    deploy-frontend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Debug env
              run: echo ${{ vars.VITE_API_URL }}

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Install dependencies & Set Env
              run: |
                  make install-frontend
                  # On force la création du .env avec la bonne URL avant le build Docker
                  echo "VITE_API_URL=${{ vars.VITE_API_URL }}" > ./frontend/.env

            - name: Build and push frontend image
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile.prod
                  push: true
                  tags: |
                      vials512t/greenmarket:frontend-latest
                      vials512t/greenmarket:frontend-${{ github.sha }}

    deploy:
        needs: [deploy-backend, deploy-frontend]
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Copy compose file to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  passphrase: ${{ secrets.VPS_PASSPHRASE }}
                  source: docker-compose.prod.yml
                  target: /opt/app

            - name: Deploy on VPS
              uses: appleboy/ssh-action@v1.0.3
              env:
                  ENV_FRONTEND: ${{ secrets.ENV_FRONTEND_PROD }}
                  ENV_BACKEND: ${{ secrets.ENV_BACKEND_PROD }}
                  ENV_DB: ${{ secrets.ENV_DB_PROD }}
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  passphrase: ${{ secrets.VPS_PASSPHRASE }}
                  envs: ENV_FRONTEND,ENV_BACKEND,ENV_DB,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
                  script: |
                      set -e

                      mkdir -p /opt/app
                      cd /opt/app

                      # Injection propre des variables d'environnement
                      echo "$ENV_FRONTEND" > .env.frontend.prod
                      echo "$ENV_BACKEND" > .env.backend.prod
                      echo "$ENV_DB" > .env.db.prod

                      mkdir -p nginx
                      cat > nginx/default.conf << 'EOF'
                      server {
                          listen 80;
                          server_name _;

                          # Redirection vers le Backend
                          location /api {
                              proxy_pass http://green_market_backend:80;
                              proxy_set_header Host $host;
                              proxy_set_header X-Real-IP $remote_addr;
                              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                              proxy_set_header X-Forwarded-Proto $scheme;
                          }

                          # Redirection vers le Frontend (Port 80 du container)
                          location / {
                              proxy_pass http://green_market_frontend:80;
                              proxy_set_header Host $host;
                              proxy_set_header X-Real-IP $remote_addr;
                              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                              proxy_set_header X-Forwarded-Proto $scheme;
                          }
                      }
                      EOF

                      # Lancement de Docker
                      docker login -u "${DOCKERHUB_USERNAME}" -p "${DOCKERHUB_TOKEN}"
                      docker compose -f docker-compose.prod.yml pull
                      docker compose -f docker-compose.prod.yml up -d --remove-orphans
                      docker image prune -f