name: Continuous Deployment

on:
    push:
        branches: [main]

jobs:
    deploy-backend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Install dependencies
              run: make install-backend

            - name: Build and push backend image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  file: ./backend/Dockerfile.prod
                  push: true
                  tags: |
                      vials512t/greenmarket:backend-latest
                      vials512t/greenmarket:backend-${{ github.sha }}

    deploy-frontend:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Debug env
              run: echo ${{ vars.VITE_API_URL }}

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Install dependencies & Set Env
              run: |
                  make install-frontend
                  # On force la création du .env avec la bonne URL avant le build Docker
                  echo "VITE_API_URL=${{ vars.VITE_API_URL }}" > ./frontend/.env

            - name: Build and push frontend image
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile.prod
                  push: true
                  tags: |
                      vials512t/greenmarket:frontend-latest
                      vials512t/greenmarket:frontend-${{ github.sha }}

    deploy:
        needs: [deploy-backend, deploy-frontend]
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Copy compose file to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  passphrase: ${{ secrets.VPS_PASSPHRASE }}
                  source: docker-compose.prod.yml
                  target: /opt/app

            - name: Deploy on VPS
              uses: appleboy/ssh-action@v1.0.3
              env:
                  NODE_ENV: ${{ vars.NODE_ENV }}
                  PORT: ${{ vars.PORT }}
                  DB_HOST: ${{ vars.DB_HOST }}
                  DB_USER: ${{ vars.DB_USER }}
                  DB_NAME: ${{ vars.DB_NAME }}
                  DB_PORT: ${{ vars.DB_PORT }}
                  JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
                  VITE_API_URL: ${{ vars.VITE_API_URL }}
                  VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}

                  MYSQL_USER: ${{ vars.MYSQL_USER }}
                  MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}

                  MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
                  MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  passphrase: ${{ secrets.VPS_PASSPHRASE }}
                  envs: NODE_ENV,PORT,MYSQL_USER,MYSQL_PASSWORD,MYSQL_DATABASE,MYSQL_ROOT_PASSWORD,DB_HOST,DB_USER,DB_NAME,DB_PORT,JWT_EXPIRES_IN,VITE_API_URL,VITE_BACKEND_URL,DB_PASSWORD,DB_ROOT_PASSWORD,JWT_SECRET,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
                  script: |
                      set -e

                      mkdir -p /opt/app
                      cd /opt/app

                      cat > .env <<EOF
                      NODE_ENV=${NODE_ENV}
                      PORT=${PORT}
                      MYSQL_USER=${MYSQL_USER}
                      MYSQL_PASSWORD=${MYSQL_PASSWORD}
                      MYSQL_DATABASE=${MYSQL_DATABASE}
                      MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
                      DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:${DB_PORT}/${MYSQL_DATABASE}
                      VITE_API_URL=${VITE_API_URL}
                      VITE_BACKEND_URL=${VITE_BACKEND_URL}
                      APP_ENV=prod
                      EOF

                      mkdir -p nginx
                      cat > nginx/default.conf << 'EOF'
                      server {
                          listen 80;
                          server_name _;

                          # Redirection vers le Backend
                          location /api {
                              proxy_pass http://green_market_backend:80;
                              proxy_set_header Host $host;
                              proxy_set_header X-Real-IP $remote_addr;
                              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                              proxy_set_header X-Forwarded-Proto $scheme;
                          }

                          # Redirection vers le Frontend
                          location / {
                              proxy_pass http://green_market_frontend:5173;
                              proxy_set_header Host $host;
                              proxy_set_header X-Real-IP $remote_addr;
                              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                              proxy_set_header X-Forwarded-Proto $scheme;
                              
                              proxy_http_version 1.1;
                              proxy_set_header Upgrade $http_upgrade;
                              proxy_set_header Connection "upgrade";
                          }
                      }
                      EOF

                      # 3. Lancement de Docker (déjà existant)
                      docker login -u "${DOCKERHUB_USERNAME}" -p "${DOCKERHUB_TOKEN}"
                      docker compose -f docker-compose.prod.yml pull
                      docker compose -f docker-compose.prod.yml up -d --remove-orphans
                      docker image prune -f
